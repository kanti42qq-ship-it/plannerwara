<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Couple Planner 🤍</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-pink-50/50 text-gray-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-semibold text-pink-600 flex items-center gap-2">
                <span>🤍</span> Our Couple Planner
            </h1>
            <div id="current-date" class="text-sm text-gray-500 font-medium"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 grid gap-6 md:grid-cols-3">
        
        <!-- Left Column: Calendar & Quick Note -->
        <div class="space-y-6 md:col-span-1">
            <!-- Mini Calendar -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-pink-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-medium text-gray-700" id="calendar-month-year">สิงหาคม 2026</h2>
                    <div class="flex gap-1">
                        <button onclick="changeMonth(-1)" class="p-1 hover:bg-pink-50 rounded-lg text-gray-600">&lt;</button>
                        <button onclick="changeMonth(1)" class="p-1 hover:bg-pink-50 rounded-lg text-gray-600">&gt;</button>
                    </div>
                </div>
                <div class="grid grid-cols-7 text-center text-xs text-gray-400 font-medium mb-2">
                    <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
                </div>
                <div id="calendar-days" class="grid grid-cols-7 text-center text-sm gap-y-2">
                    <!-- Days will be injected here -->
                </div>
            </div>

            <!-- Quick Note / Secret Code Box -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-pink-100">
                <h2 class="font-medium text-gray-700 mb-2 flex items-center gap-2">
                    <span>💌</span> โน้ตลับของเราสองคน
                </h2>
                <textarea id="secret-note" rows="4" class="w-full p-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 resize-none" placeholder="เขียนข้อความหากันตรงนี้..."></textarea>
                <button onclick="saveNote()" class="mt-2 w-full bg-pink-500 hover:bg-pink-600 text-white py-2 rounded-xl text-sm font-medium transition">บันทึกโน้ต</button>
            </div>
        </div>

        <!-- Right Column: Checklists & Shared Plans -->
        <div class="space-y-6 md:col-span-2">
            <!-- Checklist Section -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-pink-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-medium text-gray-700 flex items-center gap-2">
                        <span>✨</span> สิ่งที่ต้องทำด้วยกัน
                    </h2>
                    <span id="task-counter" class="text-xs bg-pink-100 text-pink-600 px-2.5 py-1 rounded-full font-medium">0/0 สำเร็จ</span>
                </div>

                <!-- Add Task Input -->
                <div class="flex gap-2 mb-4">
                    <input type="text" id="new-task-input" class="flex-1 px-4 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400" placeholder="เพิ่มภารกิจใหม่ เช่น ไปคาเฟ่สุดสัปดาห์นี้...">
                    <button onclick="addTask()" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition">เพิ่ม</button>
                </div>

                <!-- Task List -->
                <div id="task-list" class="space-y-2.5 max-h-[350px] overflow-y-auto pr-1">
                    <!-- Tasks will be injected here -->
                </div>
            </div>
        </div>

    </main>

    <script>
        // Simple client-side state with localStorage (can be easily hooked to Firebase)
        let tasks = JSON.parse(localStorage.getItem('couple_tasks')) || [
            { id: 1, text: 'ไปกินกุ้งดองเกาหลีด้วยกัน 🦐', completed: true },
            { id: 2, text: 'วางแผนทริปเที่ยววันหยุดยาว ✈️', completed: false }
        ];

        let noteContent = localStorage.getItem('couple_note') || 'รักน้า เจ้าตัวเล็ก 🤍';
        document.getElementById('secret-note').value = noteContent;

        // Render Date
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('th-TH', options);

        // Render Tasks
        function renderTasks() {
            const listEl = document.getElementById('task-list');
            listEl.innerHTML = '';
            
            if (tasks.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 py-6 text-sm">ยังไม่มีรายการภารกิจ เพิ่มเลย! 👇</p>';
            }

            let completedCount = tasks.filter(t => t.completed).length;
            document.getElementById('task-counter').innerText = `${completedCount}/${tasks.length} สำเร็จ`;

            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-xl border transition ${task.completed ? 'bg-gray-50 border-gray-100 text-gray-400 line-through' : 'bg-white border-pink-50 text-gray-700'}`;
                div.innerHTML = `
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})" class="w-4 h-4 text-pink-500 rounded focus:ring-pink-400 cursor-pointer">
                        <span class="text-sm">${task.text}</span>
                    </label>
                    <button onclick="deleteTask(${task.id})" class="text-gray-300 hover:text-red-500 px-2 text-sm transition">✕</button>
                `;
                listEl.appendChild(div);
            });

            localStorage.setItem('couple_tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const input = document.getElementById('new-task-input');
            const text = input.value.trim();
            if(!text) return;
            
            tasks.push({ id: Date.now(), text, completed: false });
            input.value = '';
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        function saveNote() {
            const content = document.getElementById('secret-note').value;
            localStorage.setItem('couple_note', content);
            alert('บันทึกโน้ตเรียบร้อยแล้วจ้า 🤍');
        }

        // Mini Calendar Generator
        let currentDate = new Date();
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            document.getElementById('calendar-month-year').innerText = `${monthNames[month]} ${year + 543}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            for(let i = 0; i < firstDayIndex; i++) {
                daysContainer.innerHTML += `<div></div>`;
            }

            const today = new Date();
            for(let day = 1; day <= totalDays; day++) {
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                daysContainer.innerHTML += `
                    <div class="py-1 text-sm rounded-full ${isToday ? 'bg-pink-500 text-white font-medium' : 'hover:bg-pink-50 text-gray-600'} cursor-pointer">${day}</div>
                `;
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        // Initialize
        renderTasks();
        renderCalendar();
    </script>
</body>
</html>
