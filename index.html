<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Couple Planner 🐱🕷️</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex justify-center items-center p-2 sm:p-4">

  <div id="root" class="w-full max-w-md"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [currentView, setCurrentView] = useState('home'); // 'home', 'wara', 'chen'
      const [waraTab, setWaraTab] = useState('calendar'); // 'calendar', 'notes', 'passwords'
      const [chenTab, setChenTab] = useState('calendar'); // 'calendar', 'schedule', 'homework'
      const [selectedDate, setSelectedDate] = useState(4);
      
      // ตัวอย่างข้อมูลโน้ตฝั่งวรา
      const [waraEvents, setWaraEvents] = useState({
        4: [
          { text: 'เตรียมกุ้งและแซลมอนสำหรับดอง...', color: 'bg-pink-300 text-pink-900' },
          { text: 'ซื้อน้ำดองซีอิ๊ว งาขาว และโชยุเข้าบ้าน', color: 'bg-orange-200 text-orange-900' }
        ]
      });

      // ตัวอย่างข้อมูลโน้ตฝั่งเชน
      const [chenEvents, setChenEvents] = useState({
        4: [{ text: 'เตรียม...', color: 'bg-pink-500 text-white' }],
        5: [{ text: 'เดินทาง...', color: 'bg-emerald-400 text-slate-950' }]
      });

      const [inputText, setInputText] = useState('');
      const [selectedColor, setSelectedColor] = useState('bg-pink-300 text-pink-900');

      const colorOptions = [
        'bg-pink-300 text-pink-900',
        'bg-red-400 text-white',
        'bg-orange-300 text-orange-950',
        'bg-amber-200 text-amber-950',
        'bg-stone-300 text-stone-900',
        'bg-sky-200 text-sky-950',
        'bg-emerald-200 text-emerald-950',
        'bg-yellow-100 text-yellow-950',
        'bg-purple-300 text-purple-950'
      ];

      const addEvent = (person) => {
        if (!inputText.trim()) return;
        const newEntry = { text: inputText, color: selectedColor };
        if (person === 'wara') {
          setWaraEvents({
            ...waraEvents,
            [selectedDate]: [...(waraEvents[selectedDate] || []), newEntry]
          });
        } else {
          setChenEvents({
            ...chenEvents,
            [selectedDate]: [...(chenEvents[selectedDate] || []), newEntry]
          });
        }
        setInputText('');
      };

      const deleteEvent = (person, index) => {
        if (person === 'wara') {
          const list = [...(waraEvents[selectedDate] || [])];
          list.splice(index, 1);
          setWaraEvents({ ...waraEvents, [selectedDate]: list });
        } else {
          const list = [...(chenEvents[selectedDate] || [])];
          list.splice(index, 1);
          setChenEvents({ ...chenEvents, [selectedDate]: list });
        }
      };

      // --- หน้าหลัก (HOME) ---
      if (currentView === 'home') {
        return (
          <div class="space-y-6 p-4">
            {/* Card วรา */}
            <div 
              onClick={() => setCurrentView('wara')}
              class="cursor-pointer bg-gradient-to-r from-pink-400 to-rose-400 rounded-3xl p-6 text-white shadow-lg transform transition hover:scale-105 relative overflow-hidden h-44 flex flex-col justify-between"
            >
              <div>
                <h1 class="text-3xl font-bold flex items-center gap-2">วรา 🌸</h1>
                <p class="text-sm opacity-90 mt-1">ปฏิทินกิจกรรม • โน้ต • บันทึกรหัสผ่าน</p>
              </div>
              <div class="self-end bg-white text-pink-500 rounded-full p-3 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </div>
            </div>

            {/* Card เชน */}
            <div 
              onClick={() => setCurrentView('chen')}
              class="cursor-pointer bg-gradient-to-r from-indigo-900 via-blue-800 to-sky-500 rounded-3xl p-6 text-white shadow-lg transform transition hover:scale-105 relative overflow-hidden h-44 flex flex-col justify-between"
            >
              <div>
                <span class="inline-block bg-white/20 text-xs px-3 py-1 rounded-full mb-2">🕷️ Spidey Zone</span>
                <h1 class="text-3xl font-bold flex items-center gap-2">เชน 🕸️</h1>
                <p class="text-sm opacity-90 mt-1">ปฏิทินกิจกรรม • ตารางเรียน • บันทึกการบ้าน</p>
              </div>
              <div class="self-end bg-white text-blue-900 rounded-full p-3 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </div>
            </div>

            <p class="text-center text-xs text-slate-500 pt-8">10/10/2568</p>
          </div>
        );
      }

      // --- หน้า วรา (WARA ZONE) ---
      if (currentView === 'wara') {
        return (
          <div class="bg-pink-50 text-slate-800 min-h-screen rounded-3xl p-4 shadow-xl flex flex-col justify-between">
            <div>
              {/* Header */}
              <div class="bg-gradient-to-r from-pink-400 to-rose-300 rounded-2xl p-4 text-white flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2">🎀 Kitty Calendar</h2>
                <button onClick={() => setCurrentView('home')} class="bg-white/30 hover:bg-white/40 text-white text-sm px-3 py-1.5 rounded-xl transition">
                  🏠 หน้าแรก
                </button>
              </div>

              {/* Month Header */}
              <div class="flex justify-between items-center px-2 mb-3">
                <h3 class="text-pink-600 font-bold text-lg">สิงหาคม 2026</h3>
                <div class="flex gap-2">
                  <button class="w-8 h-8 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center">‹</button>
                  <button class="w-8 h-8 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center">›</button>
                </div>
              </div>

              {/* Grid Days Header */}
              <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-500 mb-2">
                <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
              </div>

              {/* Days Grid */}
              <div class="grid grid-cols-7 gap-1 text-xs mb-6">
                <div class="h-16 bg-white/40 rounded-xl"></div>
                {[...Array(31)].map((_, i) => {
                  const day = i + 1;
                  const hasEvents = waraEvents[day] && waraEvents[day].length > 0;
                  const isSelected = selectedDate === day;
                  return (
                    <div 
                      key={day} 
                      onClick={() => setSelectedDate(day)}
                      class={`h-16 p-1 rounded-xl border cursor-pointer transition flex flex-col justify-between ${
                        isSelected ? 'border-pink-400 bg-pink-100/50 ring-2 ring-pink-300' : 'border-pink-100 bg-white/80'
                      }`}
                    >
                      <span class="font-semibold text-slate-700">{day}</span>
                      <div class="space-y-0.5 overflow-hidden">
                        {waraEvents[day]?.slice(0, 2).map((ev, idx) => (
                          <div key={idx} class={`text-[9px] truncate px-1 rounded ${ev.color}`}>
                            {ev.text}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Manage Form */}
              <div class="bg-white rounded-3xl p-4 border border-pink-100 shadow-sm space-y-3">
                <h4 class="text-pink-600 font-bold text-center text-base">จัดการข้อความ ( {selectedDate} สิงหาคม )</h4>
                
                <div class="text-xs text-slate-500">เลือกสีบันทึก:</div>
                <div class="flex flex-wrap gap-2">
                  {colorOptions.map((c, idx) => (
                    <button 
                      key={idx} 
                      onClick={() => setSelectedColor(c)}
                      class={`w-7 h-7 rounded-full ${c.split(' ')[0]} ${selectedColor === c ? 'ring-2 ring-offset-1 ring-pink-500' : ''}`}
                    />
                  ))}
                </div>

                <div class="flex gap-2">
                  <input 
                    type="text" 
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    placeholder="+ บันทึกกิจกรรม..."
                    class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-sm focus:outline-none focus:border-pink-400"
                  />
                  <button 
                    onClick={() => addEvent('wara')}
                    class="bg-pink-500 hover:bg-pink-600 text-white font-medium px-5 py-2 rounded-2xl text-sm transition"
                  >
                    เพิ่ม
                  </button>
                </div>

                {/* Event List */}
                <div class="space-y-2 pt-2">
                  {waraEvents[selectedDate]?.map((ev, index) => (
                    <div key={index} class="flex justify-between items-center bg-pink-50/60 p-2.5 rounded-2xl border border-pink-100 text-xs">
                      <div class="flex items-center gap-2">
                        <span class={`w-3 h-3 rounded-full ${ev.color.split(' ')[0]}`}></span>
                        <span class="text-slate-700">{ev.text}</span>
                      </div>
                      <button onClick={() => deleteEvent('wara', index)} class="text-red-400 hover:text-red-600">🗑️</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Bottom Nav */}
            <div class="bg-white rounded-2xl mt-4 p-2 flex justify-around border border-pink-100 shadow-sm text-xs">
              <button onClick={() => setWaraTab('calendar')} class={`flex flex-col items-center gap-1 ${waraTab === 'calendar' ? 'text-pink-500 font-bold' : 'text-slate-400'}`}>
                📅 <span>ปฏิทิน</span>
              </button>
              <button onClick={() => setWaraTab('notes')} class={`flex flex-col items-center gap-1 ${waraTab === 'notes' ? 'text-pink-500 font-bold' : 'text-slate-400'}`}>
                📝 <span>โน้ต</span>
              </button>
              <button onClick={() => setWaraTab('passwords')} class={`flex flex-col items-center gap-1 ${waraTab === 'passwords' ? 'text-pink-500 font-bold' : 'text-slate-400'}`}>
                🔑 <span>รหัสผ่าน</span>
              </button>
            </div>
          </div>
        );
      }

      // --- หน้า เชน (SPIDEY ZONE) ---
      if (currentView === 'chen') {
        return (
          <div class="bg-slate-900 text-slate-100 min-h-screen rounded-3xl p-4 shadow-xl flex flex-col justify-between border border-slate-800">
            <div>
              {/* Header */}
              <div class="bg-gradient-to-r from-indigo-900 to-blue-700 rounded-2xl p-4 text-white flex justify-between items-center mb-4 shadow-lg border border-indigo-500/30">
                <h2 class="text-xl font-bold flex items-center gap-2">🕷️ Spidey Calendar</h2>
                <button onClick={() => setCurrentView('home')} class="bg-white/20 hover:bg-white/30 text-white text-sm px-3 py-1.5 rounded-xl transition">
                  🏠 หน้าแรก
                </button>
              </div>

              {/* Month Header */}
              <div class="flex justify-between items-center px-2 mb-3">
                <h3 class="text-sky-400 font-bold text-lg">สิงหาคม 2026</h3>
                <div class="flex gap-2">
                  <button class="w-8 h-8 rounded-full bg-slate-800 text-sky-400 flex items-center justify-center">‹</button>
                  <button class="w-8 h-8 rounded-full bg-slate-800 text-sky-400 flex items-center justify-center">›</button>
                </div>
              </div>

              {/* Grid Days Header */}
              <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
                <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
              </div>

              {/* Days Grid */}
              <div class="grid grid-cols-7 gap-1 text-xs mb-6">
                <div class="h-16 bg-slate-800/40 rounded-xl"></div>
                {[...Array(31)].map((_, i) => {
                  const day = i + 1;
                  const isSelected = selectedDate === day;
                  return (
                    <div 
                      key={day} 
                      onClick={() => setSelectedDate(day)}
                      class={`h-16 p-1 rounded-xl border cursor-pointer transition flex flex-col justify-between ${
                        isSelected ? 'border-red-500 bg-slate-800 ring-2 ring-red-500/50' : 'border-slate-800 bg-slate-800/60'
                      }`}
                    >
                      <span class="font-semibold text-slate-300">{day}</span>
                      <div class="space-y-0.5 overflow-hidden">
                        {chenEvents[day]?.slice(0, 2).map((ev, idx) => (
                          <div key={idx} class={`text-[9px] truncate px-1 rounded ${ev.color}`}>
                            {ev.text}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Manage Form */}
              <div class="bg-slate-800/80 rounded-3xl p-4 border border-slate-700 shadow-sm space-y-3">
                <h4 class="text-sky-400 font-bold text-center text-base">จัดการข้อความ ( {selectedDate} สิงหาคม )</h4>
                
                <div class="text-xs text-slate-400">เลือกสีบันทึก:</div>
                <div class="flex flex-wrap gap-2">
                  {colorOptions.map((c, idx) => (
                    <button 
                      key={idx} 
                      onClick={() => setSelectedColor(c)}
                      class={`w-7 h-7 rounded-full ${c.split(' ')[0]} ${selectedColor === c ? 'ring-2 ring-offset-2 ring-offset-slate-900 ring-sky-400' : ''}`}
                    />
                  ))}
                </div>

                <div class="flex gap-2">
                  <input 
                    type="text" 
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    placeholder="+ บันทึกกิจกรรม..."
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-2xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-400"
                  />
                  <button 
                    onClick={() => addEvent('chen')}
                    class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium px-5 py-2 rounded-2xl text-sm transition shadow-md"
                  >
                    เพิ่ม
                  </button>
                </div>

                {/* Event List */}
                <div class="space-y-2 pt-2">
                  {chenEvents[selectedDate]?.map((ev, index) => (
                    <div key={index} class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-2xl border border-slate-700 text-xs">
                      <div class="flex items-center gap-2">
                        <span class={`w-3 h-3 rounded-full ${ev.color.split(' ')[0]}`}></span>
                        <span class="text-slate-200">{ev.text}</span>
                      </div>
                      <button onClick={() => deleteEvent('chen', index)} class="text-red-400 hover:text-red-500">🗑️</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Bottom Nav */}
            <div class="bg-slate-800 rounded-2xl mt-4 p-2 flex justify-around border border-slate-700 shadow-sm text-xs">
              <button onClick={() => setChenTab('calendar')} class={`flex flex-col items-center gap-1 ${chenTab === 'calendar' ? 'text-red-400 font-bold' : 'text-slate-400'}`}>
                📅 <span>ปฏิทิน</span>
              </button>
              <button onClick={() => setChenTab('schedule')} class={`flex flex-col items-center gap-1 ${chenTab === 'schedule' ? 'text-red-400 font-bold' : 'text-slate-400'}`}>
                🎓 <span>ตารางเรียน</span>
              </button>
              <button onClick={() => setChenTab('homework')} class={`flex flex-col items-center gap-1 ${chenTab === 'homework' ? 'text-red-400 font-bold' : 'text-slate-400'}`}>
                📖 <span>การบ้าน</span>
              </button>
            </div>
          </div>
        );
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
