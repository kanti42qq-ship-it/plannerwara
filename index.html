<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couple Planner</title>
    
    <!-- Font & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Mitr', 'Fredoka', sans-serif;
        }

        body {
            background-color: #fdfbf7;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ----- LANDING PAGE ----- */
        .landing-page {
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.8s ease-in-out;
        }

        .landing-title {
            font-size: 2rem;
            color: #d86979;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .landing-subtitle {
            font-size: 1.1rem;
            color: #8c8c8c;
            margin-bottom: 30px;
        }

        .profiles-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            width: 240px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .card.wara-card {
            background: linear-gradient(145deg, #ffffff, #fff0f3);
        }

        .card.wara-card:hover {
            border-color: #ffb6c1;
        }

        .card.chen-card {
            background: linear-gradient(145deg, #ffffff, #f0f4ff);
        }

        .card.chen-card:hover {
            border-color: #a0c4ff;
        }

        .profile-badge {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .wara-card .profile-badge {
            background: #ffe5ec;
            color: #d86979;
        }

        .chen-card .profile-badge {
            background: #e2eafc;
            color: #4a6fa5;
        }

        .profile-name {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .profile-desc {
            font-size: 0.85rem;
            color: #7d7d7d;
            margin-bottom: 20px;
        }

        .enter-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            color: white;
            transition: transform 0.2s;
        }

        .wara-card .enter-btn { background: #ff85a1; }
        .chen-card .enter-btn { background: #6c5ce7; }

        .card:hover .enter-btn {
            transform: scale(1.1);
        }

        /* ----- MAIN CONTENT ----- */
        .main-content {
            display: none;
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #f0f0f0;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: #f5f5f5;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #e0e0e0;
        }

        .section-box {
            background: #fafafa;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- หน้าแรก เลือกโปรไฟล์ -->
    <div class="landing-page" id="landingPage">
        <h1 class="landing-title">❤️ แพลนเนอร์บันทึกกิจกรรม</h1>
        <p class="landing-subtitle">Couple Planner</p>

        <div class="profiles-container">
            <!-- โปรไฟล์ วรา -->
            <div class="card wara-card" onclick="selectUser('wara')">
                <span class="profile-badge">🎀 Hello Kitty World</span>
                <h2 class="profile-name">วรา</h2>
                <p class="profile-desc">ปฏิทิน / รหัสผ่าน / โน้ต</p>
                <div class="enter-btn"><i class="fas fa-arrow-right"></i></div>
            </div>

            <!-- โปรไฟล์ เชน -->
            <div class="card chen-card" onclick="selectUser('chen')">
                <span class="profile-badge">🕷️ Spidey Zone</span>
                <h2 class="profile-name">เชน</h2>
                <p class="profile-desc">ปฏิทิน / ตารางเรียน / การบ้าน / รหัสผ่าน / โน้ต</p>
                <div class="enter-btn"><i class="fas fa-arrow-right"></i></div>
            </div>
        </div>
    </div>

    <!-- หน้าเนื้อหาหลัก แพลนเนอร์ -->
    <div class="main-content" id="mainContent">
        <div class="header">
            <h2 class="header-title" id="userTitle">🎀 Kitty Notes & Secrets</h2>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> สลับผู้ใช้</button>
        </div>

        <div class="section-box">
            <h3 class="section-title"><i class="far fa-calendar-alt"></i> ปฏิทินบันทึกกิจกรรม</h3>
            <p style="color: #666; font-size: 0.95rem;">ยินดีต้อนรับสู่แพลนเนอร์ของคุณ! ระบบพร้อมใช้งานแล้วครับ</p>
        </div>
    </div>

    <script>
        function selectUser(user) {
            // ซ่อนหน้าแรก
            document.getElementById('landingPage').style.display = 'none';
            
            // แสดงหน้าเนื้อหา
            const mainContent = document.getElementById('mainContent');
            mainContent.style.display = 'block';

            // เปลี่ยนหัวข้อตามคนที่เลือก
            const userTitle = document.getElementById('userTitle');
            if (user === 'wara') {
                userTitle.innerHTML = '🎀 Kitty Notes & Secrets (วรา)';
                userTitle.style.color = '#d86979';
            } else {
                userTitle.innerHTML = '🕷️ Spidey Zone (เชน)';
                userTitle.style.color = '#4a6fa5';
            }
        }

        function goBack() {
            // แสดงหน้าแรก ซ่อนหน้าเนื้อหา
            document.getElementById('landingPage').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
        }
    </script>
</body>
</html>
